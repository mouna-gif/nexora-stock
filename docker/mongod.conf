# MongoDB 7.0.11 Community — configuration alignée sur l'environnement Windows
# (standalone, base dédiée nexora, AUCUN script destructif).
storage:
  dbPath: /data/db

net:
  port: 27017
  bindIp: 0.0.0.0

# Standalone : transactions multi-documents indisponibles — la cohérence
# applicative repose sur des mises à jour atomiques ($inc + version)
# et le journal immuable des mouvements (voir backend/app/services/stock_service.py).
setParameter:
  enableLocalhostAuthBypass: false
