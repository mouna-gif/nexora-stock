# ─────────────────────────────────────────────────────────────
# Nexora Smart Stock AI — stack complète
#   mongo     : MongoDB 7.0.11 Community (base nexora)
#   backend   : FastAPI + PyMongo async (aucun Payload/ORM SQL/ERP)
#   worker    : calculs longs IA (prévisions, anomalies, KPIs)
#   frontend  : Vite/React servi par nginx + proxy /api
# Démarrage : docker compose up --build
# ─────────────────────────────────────────────────────────────

services:
  mongo:
    image: mongo:7.0.11
    container_name: sss-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongod.conf:/etc/mongod.conf:ro
    command: ["mongod", "--config", "/etc/mongod.conf"]
    healthcheck:
      test: ["CMD", "mongosh", "mongodb://127.0.0.1:27017", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: sss-backend
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: nexora
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-0123456789}
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173
      WORKER_EMBEDDED: "false"
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

  worker:
    build: ./backend
    container_name: sss-worker
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: nexora
      WORKER_POLL_INTERVAL: "5"
    command: ["python", "-m", "app.workers.main"]
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: sss-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mongo_data:
